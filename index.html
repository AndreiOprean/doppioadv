<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doppio Adventures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }

    /* Smooth fade for slideshow */
    .fade {
      transition: opacity 0.8s ease-in-out;
      opacity: 1;
    }
    .fade.hidden {
      opacity: 0;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- HERO (FULL IMAGE FIT) -->
  <header class="relative h-[80vh] flex items-center justify-center bg-black">
    <img src="poster.png" class="absolute w-full h-full object-contain" />
    <div class="absolute inset-0 bg-black/40"></div>

    <div class="relative text-center px-4">
      <a href="#contact" class="inline-block mt-6 bg-yellow-500 hover:bg-yellow-600 text-black px-6 py-3 rounded-2xl font-semibold transition-all duration-300">
        Rezervă acum
      </a>
    </div>
  </header>

  <!-- SLIDESHOW -->
  <section class="py-12 px-4 md:px-12 bg-white">
    <h2 class="text-3xl font-bold mb-6 text-center">Galerie</h2>

    <div class="relative max-w-4xl mx-auto">
      <img id="slide" src="image1.jpg" class="fade w-full h-[400px] object-cover rounded-2xl shadow-lg">

      <button onclick="prevSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white px-4 py-2 rounded-xl hover:bg-black transition">❮</button>
      <button onclick="nextSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white px-4 py-2 rounded-xl hover:bg-black transition">❯</button>
    </div>

    <!-- VIDEO -->
    <div class="mt-10 max-w-4xl mx-auto">
      <video controls class="w-full rounded-2xl shadow-lg">
        <source src="video.mov" type="video/mp4">
      </video>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="py-12 px-6 md:px-20 bg-gray-100 text-center">
    <h2 class="text-3xl font-bold mb-4">Despre noi</h2>
    <p class="max-w-3xl mx-auto text-lg">
      Doppio Adventures îți oferă experiențe off-road de neuitat în Munții Apuseni.
      Explorează natura pe ATV-uri moderne, pe trasee spectaculoase pline de adrenalină.
    </p>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="py-12 px-4 bg-yellow-500">
    <h2 class="text-3xl font-bold mb-6 text-center text-black">Rezervă aventura ta</h2>

    <form action="https://formspree.io/f/your-form-id" method="POST" class="w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="text" name="name" placeholder="Nume" required class="p-4 rounded-xl border">
      <input type="email" name="email" placeholder="Email" required class="p-4 rounded-xl border">
      <input type="date" name="date" required class="p-4 rounded-xl border">
      <input type="text" name="phone" placeholder="Telefon" class="p-4 rounded-xl border">
      <textarea name="message" placeholder="Detalii (nr. persoane, durată...)" class="md:col-span-2 p-4 rounded-xl border"></textarea>
      <button type="submit" class="md:col-span-2 bg-black text-white py-4 rounded-xl font-semibold hover:bg-gray-900 transition">
        Trimite rezervarea
      </button>
    </form>
  </section>

  <!-- MAP -->
  <section class="py-12 px-4 md:px-12 bg-white">
    <h2 class="text-3xl font-bold mb-6 text-center">Locație</h2>
    <iframe src="https://www.google.com/maps?q=Galda%20de%20Jos&output=embed" class="w-full h-[400px] rounded-2xl shadow-lg"></iframe>
  </section>

  <!-- FOOTER -->
  <footer class="bg-black text-white text-center p-6">
    <p>&copy; 2026 Doppio Adventures. Toate drepturile rezervate.</p>
  </footer>

  <!-- SLIDESHOW SCRIPT (SMOOTH) -->
  <script>
    const images = ["activ1.png","activ2.png","activ3.png"];
    let index = 0;
    const slide = document.getElementById("slide");

    function showSlide(i) {
      slide.classList.add("hidden");

      setTimeout(() => {
        index = (i + images.length) % images.length;
        slide.src = images[index];
        slide.classList.remove("hidden");
      }, 300);
    }

    function nextSlide() { showSlide(index + 1); }
    function prevSlide() { showSlide(index - 1); }

    setInterval(() => nextSlide(), 5000);
  </script>

</body>
</html>
